name: CampusOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusos
          POSTGRES_PASSWORD: campusos-ci-only
          POSTGRES_DB: campusos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusos -d campusos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project-local dependencies
        run: make setup
      - name: Backend and frontend regression tests
        env:
          CAMPUSOS_TEST_POSTGRES_URL: postgresql+psycopg://campusos:campusos-ci-only@127.0.0.1:5432/campusos_test
        run: make test
      - name: Standard frontend production build
        run: make build
      - name: Browser experience production build
        run: npm --prefix frontend run build:experience
